{
  "openapi": "3.0.3",
  "info": {
    "title": "DMCP AVATAR Gateway API",
    "description": "AVATAR Gateway endpoint for all HTTP methods under /v1/dmcp/{*path}. Forwards requests and returns responses from the target service.",
    "version": "1.0.0"
  },
  "servers": [
    {
      "url": "https://localhost:443"
    }
  ],
  "paths": {
    "/v1/dmcp/{gatewayPath}": {
      "parameters": [
        {
          "name": "gatewayPath",
          "in": "path",
          "required": true,
          "description": "The dynamic path to be gatewayed.",
          "schema": {
            "type": "string"
          }
        },
        {
          "name": "X-Correlation-ID",
          "in": "header",
          "required": true,
          "description": "Unique identifier for tracing requests.",
          "schema": {
            "type": "string"
          }
        },
        {
          "name": "X-tenant-id",
          "in": "header",
          "required": true,
          "description": "Tenant identifier for multi-tenancy.",
          "schema": {
            "type": "string"
          }
        }
      ],
      "get": {
        "summary": "Gateway GET request",
        "description": "Forwards GET requests to the target service.",
        "operationId": "gatewayGet",
        "responses": {
          "200": { "$ref": "#/components/responses/GenericResponse" },
          "400": { "$ref": "#/components/responses/GenericResponse" },
          "401": { "$ref": "#/components/responses/GenericResponse" },
          "403": { "$ref": "#/components/responses/GenericResponse" },
          "404": { "$ref": "#/components/responses/GenericResponse" },
          "500": { "$ref": "#/components/responses/GenericResponse" }
        }
      },
      "post": {
        "summary": "Gateway POST request",
        "description": "Forwards POST requests to the target service. Supports file upload.",
        "operationId": "gatewayPost",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": { "type": "object" }
            },
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "properties": {
                  "file": { "type": "string", "format": "binary" },
                  "additionalMetadata": { "type": "string" }
                }
              }
            }
          }
        },
        "responses": {
          "200": { "$ref": "#/components/responses/GenericResponse" },
          "400": { "$ref": "#/components/responses/GenericResponse" },
          "401": { "$ref": "#/components/responses/GenericResponse" },
          "403": { "$ref": "#/components/responses/GenericResponse" },
          "404": { "$ref": "#/components/responses/GenericResponse" },
          "500": { "$ref": "#/components/responses/GenericResponse" }
        }
      },
      "put": {
        "summary": "Gateway PUT request",
        "description": "Forwards PUT requests to the target service. Supports file upload.",
        "operationId": "gatewayPut",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": { "type": "object" }
            },
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "properties": {
                  "file": { "type": "string", "format": "binary" },
                  "additionalMetadata": { "type": "string" }
                }
              }
            }
          }
        },
        "responses": {
          "200": { "$ref": "#/components/responses/GenericResponse" },
          "400": { "$ref": "#/components/responses/GenericResponse" },
          "401": { "$ref": "#/components/responses/GenericResponse" },
          "403": { "$ref": "#/components/responses/GenericResponse" },
          "404": { "$ref": "#/components/responses/GenericResponse" },
          "500": { "$ref": "#/components/responses/GenericResponse" }
        }
      },
      "delete": {
        "summary": "Gateway DELETE request",
        "description": "Forwards DELETE requests to the target service.",
        "operationId": "gatewayDelete",
        "responses": {
          "200": { "$ref": "#/components/responses/GenericResponse" },
          "400": { "$ref": "#/components/responses/GenericResponse" },
          "401": { "$ref": "#/components/responses/GenericResponse" },
          "403": { "$ref": "#/components/responses/GenericResponse" },
          "404": { "$ref": "#/components/responses/GenericResponse" },
          "500": { "$ref": "#/components/responses/GenericResponse" }
        }
      },
      "patch": {
        "summary": "Gateway PATCH request",
        "description": "Forwards PATCH requests to the target service. Supports file upload.",
        "operationId": "gatewayPatch",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": { "type": "object" }
            },
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "properties": {
                  "file": { "type": "string", "format": "binary" },
                  "additionalMetadata": { "type": "string" }
                }
              }
            }
          }
        },
        "responses": {
          "200": { "$ref": "#/components/responses/GenericResponse" },
          "400": { "$ref": "#/components/responses/GenericResponse" },
          "401": { "$ref": "#/components/responses/GenericResponse" },
          "403": { "$ref": "#/components/responses/GenericResponse" },
          "404": { "$ref": "#/components/responses/GenericResponse" },
          "500": { "$ref": "#/components/responses/GenericResponse" }
        }
      }
    }
  },
  "components": {
    "responses": {
      "GenericResponse": {
        "description": "Generic JSON response for all calls",
        "content": {
          "application/json": {
            "schema": { "$ref": "#/components/schemas/GenericResponse" },
            "examples": {
              "success": {
                "value": {
                  "status": "200",
                  "message": "Operation successful",
                  "data": {
                    "key": "string",
                    "description": "string",
                    "category": "string",
                    "tenant": "string"
                  }
                }
              },
              "error": {
                "value": {
                  "status": "400",
                  "message": "Invalid input",
                  "error": {
                    "code": "400",
                    "details": "Invalid input",
                    "stacktrace": "string",
                    "correlationId": "string"
                  }
                }
              }
            }
          }
        }
      }
    },
    "schemas": {
      "GenericResponse": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "description": "HTTP status code or custom status"
          },
          "message": {
            "type": "string",
            "description": "Human-readable message"
          },
          "data": {
            "type": "object",
            "description": "Response data (present for success)"
          },
          "error": {
            "type": "object",
            "description": "Error details (present for errors)",
            "properties": {
              "code": { "type": "string" },
              "details": { "type": "string" },
              "stacktrace": { "type": "string" },
              "correlationId": { "type": "string" }
            }
          }
        }
      }
    }
  }
}