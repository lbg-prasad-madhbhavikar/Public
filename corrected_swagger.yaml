components:
  schemas:
    error:
      type: object
      required:
      - code
      - reasonCode
      - message
      properties:
        code:
          type: string
          example: CUS_API_ERR_XXX_01
        reasonCode:
          type: string
          example: Reason Code For Error
        message:
          type: string
          example: Error Message
    errorData:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/error'
