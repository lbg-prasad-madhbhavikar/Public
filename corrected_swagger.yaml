servers:
- url: https://api.example.com/dmcp/avatar/v1
  description: Production server
paths:
  /:
    get:
      summary: Retrieve a list of resources.
      parameters:
      - name: limit
        in: query
        description: Maximum number of items to return
        required: false
        schema:
          type: integer
          minimum: 1
          example: 10
      - name: offset
        in: query
        description: Offset for pagination
        required: false
        schema:
          type: integer
          minimum: 0
          example: 0
      responses:
        '200':
          description: Successful response
          headers:
            ETag:
              description: Entity tag for the returned resource
              schema:
                type: string
            Last-Modified:
              description: Last modification date of the resource
              schema:
                type: string
            Access-Control-Allow-Origin:
              description: CORS header
              schema:
                type: string
                pattern: ^[^*]+$
            X-LBG-TXN-Correlation-Id:
              description: Transaction correlation ID
              schema:
                type: string
            X-Content-Type-Options:
              description: Content type options
              schema:
                type: string
                pattern: ^nosniff$
              example: nosniff
            X-LBG-API-Version:
              description: API version header
              schema:
                type: string
          content:
            application/json; charset=UTF-8:
              schema:
                type: array
                items:
                  type: string
              example:
              - resource1
              - resource2
        '400':
          description: Bad Request
          headers:
            ETag:
              description: Entity tag for the returned resource
              schema:
                type: string
            Last-Modified:
              description: Last modification date of the resource
              schema:
