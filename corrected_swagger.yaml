            X-Content-Type-Options:
              description: Content type options
              schema:
                type: string
                pattern: ^nosniff$
              example: nosniff
            X-LBG-API-Version:
              description: API version header
              schema:
                type: string
          content:
            application/json; charset=UTF-8:
              schema:
                $ref: '#/components/schemas/errorData'
              example:
                errors:
                - code: CUS_API_ERR_400_01
                  reasonCode: InvalidInput
                  message: Bad request due to invalid input.
        '401':
          description: Unauthorized
